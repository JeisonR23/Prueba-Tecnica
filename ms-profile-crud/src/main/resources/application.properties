quarkus.application.name=ms-profile-crud
quarkus.container-image.group=
# Mongo
quarkus.mongodb.connection-string=mongodb://localhost:27017
quarkus.mongodb.database=profile_db

# JWT: esta app firma (emite) y verifica (endpoints propios de update/delete)
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=ms-profile-crud

# Par de llaves que usara ms-profile-query para llamar al endpoint interno.
# El secreto NO se escribe aqui - se toma de la variable de entorno
# INTERNAL_CLIENT_SECRET (archivo .env en dev/test, Secret de k8s en prod).
internal.client.id=ms-profile-query
internal.client.secret=${INTERNAL_CLIENT_SECRET}

quarkus.http.port=8081

# TLS (BR2: HTTPS obligatorio, TLS 1.2+)
quarkus.tls.key-store.pem.0.cert=tls/cert.pem
quarkus.tls.key-store.pem.0.key=tls/key.pem
quarkus.http.ssl-port=8444
quarkus.http.insecure-requests=disabled

# Overrides para el contenedor / k8s - las llaves ya no estan en el classpath,
# estan montadas como Secret en el filesystem del pod
%prod.quarkus.mongodb.connection-string=${MONGO_URI:mongodb://mongo:27017}
%prod.smallrye.jwt.sign.key.location=/deployments/certs/jwt/privateKey.pem
%prod.mp.jwt.verify.publickey.location=/deployments/certs/jwt/publicKey.pem
%prod.quarkus.tls.key-store.pem.0.cert=/deployments/certs/tls/cert.pem
%prod.quarkus.tls.key-store.pem.0.key=/deployments/certs/tls/key.pem

# En test corremos sobre HTTP plano - TLS solo aplica a dev y prod
%test.quarkus.http.insecure-requests=enabled
