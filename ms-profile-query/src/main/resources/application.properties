quarkus.application.name=ms-profile-query
quarkus.container-image.group=

# Verifica el JWT que emitio ms-profile-crud
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=ms-profile-crud

# Como llegar a ms-profile-crud
quarkus.rest-client.profile-crud.url=https://localhost:8444

# Mismo par de llaves que sembramos en ms-profile-crud (ApiKeySeeder).
# El secreto se toma de la variable de entorno INTERNAL_CLIENT_SECRET
# (archivo .env en dev/test, Secret de k8s en prod).
internal.client.id=ms-profile-query
internal.client.secret=${INTERNAL_CLIENT_SECRET}

# TLS propio (BR2)
quarkus.tls.key-store.pem.0.cert=tls/cert.pem
quarkus.tls.key-store.pem.0.key=tls/key.pem
quarkus.http.ssl-port=8445
quarkus.http.insecure-requests=disabled
quarkus.http.port=8082

# Solo en dev: confiar en el certificado autofirmado de ms-profile-crud.
%dev.quarkus.tls.trust-all=true

# Overrides para el contenedor / k8s
%prod.mp.jwt.verify.publickey.location=/deployments/certs/jwt/publicKey.pem
%prod.quarkus.tls.key-store.pem.0.cert=/deployments/certs/tls/cert.pem
%prod.quarkus.tls.key-store.pem.0.key=/deployments/certs/tls/key.pem
%prod.quarkus.rest-client.profile-crud.url=https://ms-profile-crud:8444
# Los dos certificados TLS son autofirmados (no los emitio una CA real) - en
# un entorno real esto se quita y se usa un truststore con el certificado de
# ms-profile-crud en su lugar.
%prod.quarkus.tls.trust-all=true

# En test corremos sobre HTTP plano
%test.quarkus.http.insecure-requests=enabled
%test.quarkus.tls.trust-all=true